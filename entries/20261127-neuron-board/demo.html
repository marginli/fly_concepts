<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神經元畫板</title>
<link rel="stylesheet" href="../../lib/style.css">
<style>
body{font-size:15px}
.wrap.board{max-width:none;padding:8px 10px 16px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.bar button{font:inherit;font-size:.86rem;padding:2px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
.bar button.on{border-color:var(--fg);font-weight:600}
.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px}
.list{max-height:78vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.vi{display:block;text-align:left;width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.vi:hover{border-color:var(--accent)}
.vi.on{border-color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.vi b{display:block;font-size:.95rem}
.vi span{color:var(--muted);font-size:.8rem}
.info h2{font-size:1.15rem;margin:0 0 2px}
.info p{margin:0 0 6px;color:var(--muted);font-size:.9rem}
.info table{border-collapse:collapse;font-size:.84rem;margin:2px 0 6px}
.info td,.info th{border-bottom:1px solid var(--line);padding:2px 10px 2px 0;text-align:left;vertical-align:top}
.info th{color:var(--muted);font-weight:500}
.stage{margin:6px 0 0}
#view{height:68vh}
@media (max-width:820px){.lay{grid-template-columns:1fr}.list{max-height:240px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div class="wrap board" id="wrap">
  <div class="bar" id="filt"></div>
  <div class="lay">
    <div class="list" id="list"></div>
    <div>
      <div class="info" id="info"></div>
      <div class="stage"><div id="view"></div><div id="panel"></div></div>
      <p class="hint" style="font-size:.84rem;color:var(--muted);margin:4px 0 0">滑鼠左鍵拖曳＝旋轉，滾輪＝縮放，右鍵拖曳＝平移；手機用手指。右邊的勾選框可以分別開關纖維、輸出點、輸入點與腦區。</p>
    </div>
  </div>
</div>
<script type="module">
import { mount } from "../../lib/viewer.js";
const DSN = { all: "全部", mcns: "MaleCNS", fw: "FlyWire", banc: "BANC" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const qs = new URLSearchParams(location.search);
const views = await (await fetch("views.json?t=" + Date.now())).json();
let ds = qs.get("ds") || "all";
const cur = views.find((v) => v.id === qs.get("view")) || views[0];

function go(params) {
  const u = new URLSearchParams(location.search);
  for (const [k, v] of Object.entries(params)) v == null ? u.delete(k) : u.set(k, v);
  location.search = u.toString();
}
const filt = document.getElementById("filt");
for (const k of Object.keys(DSN)) {
  const n = k === "all" ? views.length : views.filter((v) => v.ds === k).length;
  const b = document.createElement("button");
  b.textContent = `${DSN[k]}（${n}）`; b.className = k === ds ? "on" : "";
  b.onclick = () => { ds = k; drawList(); filt.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
  filt.appendChild(b);
}
function drawList() {
  const L = document.getElementById("list"); L.innerHTML = "";
  for (const v of views.filter((v) => ds === "all" || v.ds === ds)) {
    const b = document.createElement("button"); b.className = "vi" + (v === cur ? " on" : "");
    b.innerHTML = `<b>${esc(v.title)}</b><span>${esc(v.dataset)}　${esc(v.date)}　${v.neurons.length} 顆</span>`;
    b.onclick = () => go({ view: v.id, ds });
    L.appendChild(b);
  }
  report();
}
drawList();

function partnersHtml(P) {
  if (!P) return "";
  const NM = { up: "上游（送訊號給它，綠）", down: "下游（接收它的訊號，橙）" };
  let h = "";
  for (const d of ["up", "down"]) {
    const p = P[d]; if (!p) continue;
    const scope = p.filt ? `其中型別符合「${esc(p.filt)}」的 ${(p.n_f ?? 0).toLocaleString()} 顆、${(p.w_f ?? 0).toLocaleString()} 個連結；` : "";
    const list = p.sel.map((x) => `${esc(x.type || "無型別")}${x.side ? "（" + esc(x.side) + "）" : ""} ${esc(x.id)}：${x.w.toLocaleString()}`).join("、");
    h += `<p><b>${NM[d]}</b>：共 ${p.n.toLocaleString()} 顆、${p.w.toLocaleString()} 個連結；${scope}`
      + (p.sel.length ? `畫出連結數最多的 ${p.sel.length} 顆（連結數至少 ${p.min ?? 1}）：${list}` : `沒有符合條件的可畫`)
      + (p.no_skel ? `；另有 ${p.no_skel} 顆沒有骨架、略過` : "") + `。</p>`;
  }
  return h + `<p>連結數＝兩顆神經元之間的突觸數。</p>`;
}
if (cur) {
  const show = cur.show || ["fibre"];
  const ends = show.filter((e) => e !== "fibre");
  const EN = { pre: "輸出點（pre）", post: "輸入點（post）" };
  const top = (t) => (t && t.length ? t.map(([r, f]) => `${esc(r)} ${(f * 100).toFixed(0)}%`).join("、") : "無");
  const cnt = (n, e) => (n[e] ?? 0).toLocaleString() + (n[e + "_all"] != null ? `（全部 ${n[e + "_all"].toLocaleString()}）` : "") + (n[e + "_drawn"] != null && n[e + "_drawn"] < n[e] ? `（畫出 ${n[e + "_drawn"].toLocaleString()}）` : "");
  const rows = cur.neurons.map((n) => `<tr><td>${esc(n.type || "無型別")}${n.side ? "（" + esc(n.side) + "）" : ""}</td><td>${esc(n.id)}</td>`
    + `<td>${top(n.top)}</td>` + ends.map((e) => `<td>${cnt(n, e)}</td><td>${top(n[e + "_top"])}</td>`).join("") + `</tr>`).join("");
  const head = `<tr><th>型別</th><th>編號</th><th>纖維最多的腦區</th>` + ends.map((e) => `<th>${EN[e]}數</th><th>${EN[e]}最多的腦區</th>`).join("") + `</tr>`;
  const drawn = show.map((e) => ({ fibre: "纖維", pre: "輸出點（紅）", post: "輸入點（藍）" }[e])).concat(cur.partners ? Object.keys(cur.partners).map((d) => d === "up" ? "上游神經元（綠）" : "下游神經元（橙）") : []).join("、");
  const basis = cur.region_basis === "syn" ? "這個畫面全部神經元畫出的突觸點，落在腦區內的" : "這個畫面全部神經元落在腦區內的纖維";
  document.getElementById("info").innerHTML = `<h2>${esc(cur.title)}</h2><p>資料：${esc(cur.dataset)}${cur.note ? "。" + esc(cur.note) : ""}</p>`
    + `<p>畫出：${drawn}。腦區百分比的分母都是「落在腦區內的部分」（纖維用長度，突觸用個數）。${cur.syn_filter ? `突觸只畫和型別符合「${esc(cur.syn_filter)}」的神經元相接的：輸出點是接收方至少有一顆符合的，輸入點是送出方符合的；表上的數量和腦區百分比都只算這些，括號內是全部數量。` : ""}${cur.sampled != null && cur.sampled < 1 ? `突觸點太多，隨機畫出其中約 ${(cur.sampled * 100).toFixed(0)}%；表上數量是全部。` : ""}</p>`
    + `<div style="overflow-x:auto"><table>${head}${rows}</table></div>`
    + `<p>畫出的腦區（括號內＝${basis}，有多少在這一區）：${cur.regions.length ? cur.regions.map((r, i) => esc(r) + (cur.region_frac ? `（${(cur.region_frac[i] * 100).toFixed(0)}%）` : "")).join("、") : "無"}</p>`
    + partnersHtml(cur.partners);
  await mount("views/" + cur.id + ".json?v=" + cur.date);
} else {
  document.getElementById("info").innerHTML = "<p>還沒有畫面。</p>";
}
// 在 iframe 內：回報內容高度給條目頁（量容器的底，不用 scrollHeight；高度沒變就不送）
var lastH = 0;
function report() {
  if (parent === window) return;
  const h = Math.ceil(document.getElementById("wrap").getBoundingClientRect().bottom + 8);
  if (h !== lastH) { lastH = h; parent.postMessage({ demoH: h }, "*"); }
}
new ResizeObserver(report).observe(document.getElementById("wrap"));
report();
</script>
</body></html>
